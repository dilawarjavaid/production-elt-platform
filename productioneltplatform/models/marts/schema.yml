version: 2

models:
  - name: dim_customers
    description: "Customer dimension containing one row per customer for downstream analytics."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: dim_products
    description: "Product dimension containing product attributes used for sales and order analysis."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: fct_orders
    description: "Order-level fact table combining order details with payment information."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

  - name: fct_order_items
    description: "Order-item fact table containing product-level transactional details for each order."
    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id

      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

  - name: customer_sales_summary
    description: "Customer-level analytics summary containing total orders, total revenue, and average order value."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: fct_orders_incremental
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
              
            

  - name: dim_products
    description: "Product dimension containing product attributes used for sales and order analysis."
    columns:
      - name: product_id
        description: "Unique identifier for each product."
        tests:
          - not_null
          - unique