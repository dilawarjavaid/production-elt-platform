name: Production ELT CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python code
        run: python -m compileall ingestion scripts

  dbt-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          pip install dbt-core==1.12.3
          pip install dbt-snowflake==1.12.0

      - name: Create CI dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          productioneltplatform:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: placeholder
                user: placeholder
                password: placeholder
                role: DBT_TRANSFORMER
                database: PRODUCTION_ELT
                warehouse: ELT_WH
                schema: DBT_DEV
                threads: 4
          EOF

      - name: Parse dbt project
        working-directory: productioneltplatform
        run: dbt parse --no-partial-parse