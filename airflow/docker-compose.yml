services:
  airflow-init:
    build: .
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ..:/opt/airflow/project
      - ${USERPROFILE}/.dbt/profiles.yml:/home/airflow/.dbt/profiles.yml:ro

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      "

  airflow:
    build: .

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ..:/opt/airflow/project
      - ${USERPROFILE}/.dbt/profiles.yml:/home/airflow/.dbt/profiles.yml:ro

    ports:
      - "8080:8080"

    command: >
      bash -c "
      airflow webserver &
      airflow scheduler
      "

volumes:
  airflow_data:
  