services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build: .
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ..:/opt/airflow/project
      - ${USERPROFILE}/.dbt/profiles.yml:/home/airflow/.dbt/profiles.yml:ro

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      "

  airflow:
    build: .

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ..:/opt/airflow/project
      - ${USERPROFILE}/.dbt/profiles.yml:/home/airflow/.dbt/profiles.yml:ro

    ports:
      - "8080:8080"

    command: >
      bash -c "
      airflow webserver &
      airflow scheduler
      "

volumes:
  airflow_data:
  postgres_data: